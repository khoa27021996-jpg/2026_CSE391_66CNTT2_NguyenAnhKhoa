<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bai1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form class="container">
        <header>
            <h3>Get in touch with us by filling contact form below</h3>
        </header>
        <main class="flex">
            <input type="text" placeholder="*Enter your full name" class="flex-item">
            <input type="email" placeholder="*Enter your email address" class="flex-item">
            <input type="text" placeholder="Enter your subject" class="flex-full">
            <textarea placeholder="*Your message here..." rows="10" class="flex-full"></textarea>

        </main>
        <footer>
            <button type="submit">Sendmessage</button>
            <span>Please fill all required form field, thanks!</span>
        </footer>
    </form>
</body>
</html>
